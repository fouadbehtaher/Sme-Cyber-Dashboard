version: '3.8'

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.frontend
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://localhost:5000/api
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.backend
    ports:
      - "5000:5000"
    environment:
      - MONGODB_URI=mongodb://mongodb:27017/cyber_dashboard
      - VIRUSTOTAL_API_KEY=your_virustotal_api_key
    depends_on:
      - mongodb

  airs:
    build:
      context: ./airs
      dockerfile: Dockerfile.airs
    environment:
      - MONGODB_URI=mongodb://mongodb:27017/cyber_dashboard
    depends_on:
      - mongodb

  mongodb:
    image: mongo:5.0
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

volumes:
  mongodb_data:
